name: maude

# Two backend modes, selected by the MODE env var (default: docker):
#
#   MODE=docker  — Ollama runs as a container in the `docker-backend` profile.
#                  Self-contained, CPU-only on Apple Silicon (Metal isn't
#                  exposed to Linux guests).
#
#   MODE=metal   — Ollama runs natively on the macOS host with Metal/GPU
#                  acceleration. Only LiteLLM lives in this stack; it reaches
#                  the host via host.docker.internal.
#
# The agent (OpenCode) runs natively from the maude launcher and talks to
# LiteLLM on 127.0.0.1:4000 — it is NOT part of the compose stack.

services:
  ollama:
    image: ollama/ollama:0.4.7
    container_name: maude-ollama
    restart: unless-stopped
    profiles: ["docker-backend"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./assets/ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: maude-litellm
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
        required: false      # in metal mode the ollama service isn't enabled
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # metal mode reaches host here
    volumes:
      - ./litellm/config.${MODE:-docker}.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Launcher — static landing page on :8080 that links the other UIs.
  # nginx serves ./launcher/site and exposes a read-only directory listing
  # of the host workspace at /api/list/<path>/ (autoindex JSON), so the
  # page can scan for git repos without us writing a backend.
  launcher:
    image: nginx:alpine
    container_name: maude-launcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./launcher/site:/usr/share/nginx/html:ro
      - ./launcher/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WORKSPACE:-${HOME}}:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Web terminal — ttyd serving an xterm.js front-end on :7681, running
  # opencode against the local stack. Bind-mounts $WORKSPACE (default $HOME)
  # so file edits land on the host as the host user. Talks to Ollama
  # directly (same reason ./maude does — LiteLLM's tool_calls forwarding
  # bug); the upstream URL switches by mode via the opencode.${MODE}.json
  # mount.
  webterm:
    build:
      context: ./webterm
    image: maude-webterm:local
    container_name: maude-webterm
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
        required: false        # metal mode: ollama isn't in compose
    ports:
      - "127.0.0.1:7681:7681"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${MAUDE_UID:-1000}:${MAUDE_GID:-1000}"
    working_dir: /workspace
    environment:
      WORKSPACE: /workspace
      OPENCODE_CONFIG: /etc/maude/opencode.json
      HOME: /workspace
      TERM: xterm-256color
    volumes:
      - ${WORKSPACE:-${HOME}}:/workspace:rw
      - ./webterm/opencode.${MODE:-docker}.json:/etc/maude/opencode.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7681 -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Open WebUI — chat front-end. Talks to LiteLLM as a plain OpenAI provider,
  # so it gets exactly what every other client sees (model name `qwen-coder`).
  # We deliberately do NOT enable its built-in Ollama integration: routing
  # through LiteLLM keeps a single canonical request path and matches what
  # external clients use.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: maude-open-webui
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./webui-data:/app/backend/data
    environment:
      # Treat LiteLLM as the sole OpenAI-compatible upstream.
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1"
      OPENAI_API_KEYS: "sk-maude-local"
      ENABLE_OLLAMA_API: "False"
      # Local-only deployment on 127.0.0.1 — no need for the login wall.
      # Flip to True (and ENABLE_SIGNUP) if you ever expose this beyond loopback.
      WEBUI_AUTH: "False"
      ENABLE_SIGNUP: "False"
      WEBUI_NAME: "maude"
      # Offline hygiene: matches the rest of the stack (no telemetry, no
      # update pings, no auto-download of embedding models post-install).
      OFFLINE_MODE: "True"
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
