# LiteLLM proxy config — metal mode.
#
# Ollama runs natively on the macOS host (so it uses Metal/GPU acceleration);
# LiteLLM talks to it through Docker's host-gateway alias.

model_list:
  - model_name: qwen-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: sk-maude-local
