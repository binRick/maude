# LiteLLM proxy config — exposes the local Ollama model as an OpenAI-compatible
# endpoint so Aider (and anything else that speaks OpenAI) can talk to it.
#
# The model name used by clients is `qwen-coder`, mapped to qwen2.5-coder:14b
# at Ollama's default context window. (A 32k-context variant blows past the
# Docker VM's RAM ceiling on a 32 GB host.)

model_list:
  - model_name: qwen-coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  # Single shared key for local-only use. The proxy listens on 127.0.0.1 only
  # (see docker-compose.yml port binding), so this is defence-in-depth, not
  # a real secret.
  master_key: sk-claude-offline-local
