# LiteLLM proxy config — exposes the local Ollama model as an OpenAI-compatible
# endpoint so OpenCode (and anything else that speaks OpenAI) can talk to it.
#
# Clients send model=qwen-coder; LiteLLM routes to qwen3-coder:30b on the
# Ollama container. qwen3-coder advertises tools via the OpenAI function-
# calling protocol, which is what OpenCode needs to actually edit files.

model_list:
  - model_name: qwen-coder
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  # Single shared key for local-only use. The proxy listens on 127.0.0.1 only
  # (see docker-compose.yml port binding), so this is defence-in-depth, not
  # a real secret.
  master_key: sk-maude-local
