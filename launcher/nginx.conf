# maude launcher — nginx config.
#
# Serves the static landing page at / and proxies a read-only directory
# listing of the host workspace at /api/list/<path>/ (so the page can scan
# for git repos without us writing a backend).

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the landing page — we want service-status pings, recent
    # projects, etc. to reflect the current state on every load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /api/list/<path>/ → directory listing of $WORKSPACE/<path>/ as JSON.
    # The mount in docker-compose.yml is read-only and limited to one dir,
    # so this is just a read-only enumeration endpoint, not a write path.
    location ^~ /api/list/ {
        alias /workspace/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # 404 when the path doesn't exist, rather than falling through to the
        # static landing page (which would confuse the JS JSON.parse).
        try_files $uri $uri/ =404;
    }

    # Plain health endpoint for the compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
